services:
  wnyc-vue3:
    image: wnyc-vue3
    container_name: wnyc-vue3
    build:
      context: .
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - SENTRY_DSN=$SENTRY_DSN
      - SENTRY_ENV=$SENTRY_ENV
      - ENV=$ENV
      - LIVESTREAM_URL=$LIVESTREAM_URL
      - NAVIGATION_API=$NAVIGATION_API
      - PUBLISHER_BASE_API=$PUBLISHER_BASE_API
      - SYSTEM_MESSAGES_API=$SYSTEM_MESSAGES_API
      - STORIES_API=$STORIES_API
      - IMAGE_BASE_URL=$IMAGE_BASE_URL
      - HTL_IS_TESTING=$HTL_IS_TESTING
      - HTL_CSS=$HTL_CSS
      - HTL_JS=$HTL_JS
      - BFF_URL=$BFF_URL
      - SUPABASE_URL=$SUPABASE_URL
      - SUPABASE_KEY=$SUPABASE_KEY
      - SUPABASE_AUTH_SIGN_IN_REDIRECT_TO=$SUPABASE_AUTH_SIGN_IN_REDIRECT_TO
      - SUPABASE_AUTH_TOKEN_NAME=$SUPABASE_AUTH_TOKEN_NAME
      - FB_MEASUREMENT_ID=$FB_MEASUREMENT_ID
      - FB_API_KEY_WEB=$FB_API_KEY_WEB
      - FB_API_KEY_IOS=$FB_API_KEY_IOS
      - FB_API_KEY_ANDROID=$FB_API_KEY_ANDROID
      - FB_AUTH_DOMAIN=$FB_AUTH_DOMAIN
      - FB_PROJECT_ID=$FB_PROJECT_ID
      - FB_STORAGE_BUCKET=$FB_STORAGE_BUCKET
      - FB_MESSAGING_SENDER_ID=$FB_MESSAGING_SENDER_ID
      - FB_APP_ID_WEB=$FB_APP_ID_WEB
      - FB_APP_ID_IOS=$FB_APP_ID_IOS
      - FB_APP_ID_ANDROID=$FB_APP_ID_ANDROID
      - GTM_ID=$GTM_ID
      - OPENWEB_SPOT_ID=$OPENWEB_SPOT_ID
      - NPR_CDS_API=$NPR_CDS_API
      - NPR_CDS_API_KEY=$NPR_CDS_API_KEY
      - WNYC_NOW_FEED_URL=$WNYC_NOW_FEED_URL
      - WNYC_SHOW_SHARE_BASE_URL=$WNYC_SHOW_SHARE_BASE_URL
      - ARTICLE_STREAMFIELD_DONATION_URL=$ARTICLE_STREAMFIELD_DONATION_URL
      - SETTINGS_MENU_DONATION_URL=$SETTINGS_MENU_DONATION_URL
      - USER_AGENT=$USER_AGENT
      - ONESIGNAL_APP_ID=$ONESIGNAL_APP_ID
      - SF_LOGIN_URL=$SF_LOGIN_URL
      - SF_USERNAME=$SF_USERNAME
      - SF_CLIENT_ID=$SF_CLIENT_ID
      - SF_PRIVATE_KEY=$SF_PRIVATE_KEY
    ports:
      - 8880:8080
    command: ['./scripts/entrypoint.sh']
    restart: 'always'

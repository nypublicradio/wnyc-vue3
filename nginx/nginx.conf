include /etc/nginx/modules-enabled/*;
worker_processes  1;
error_log  /dev/stdout warn;

env ENV;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  text/html;

    # requied for shared_lua_dict
    variables_hash_max_size 4096;
    map_hash_bucket_size 128;

    # hide the version in the Server header
    server_tokens off;

    # use real client ip rather than ALB address
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # apache-style combined log format
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /dev/stdout  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  130;
    gzip  on;

    # microcaching
    # The proxy_cache_path will be used to store responses for 1s on select
    # endpoints. This improves performance with minimal impact.
    proxy_cache_path /tmp/cache keys_zone=cache:10m levels=1:2 inactive=600s max_size=100m;
    # This line tells nginx to intercept any 4xx or 5xx code that is returned by a proxy_pass
    # directive and resolve it using its error_page directive. We use this to set a fallback
    # from vue to ember.
    proxy_intercept_errors on;

    lua_shared_dict upstream 24k;
    init_by_lua_block {
        local env = os.getenv("ENV");
        ngx.shared.upstream:set("env", env)
        ngx.log(ngx.WARN, "Starting WNYC Vue3 web client Nginx with ENV=" .. env)
    }

    upstream app {
        server 0.0.0.0:3000 max_fails=0;
    }

    server {
        listen 8080;
        server_name _;
        # Use multiple DNS resolvers for better reliability across environments
        # 8.8.8.8/8.8.4.4 = Google DNS (works everywhere)
        # 1.1.1.1 = Cloudflare DNS (works everywhere)  
        # 172.16.0.2 = AWS VPC DNS (for AWS environments)
        resolver 172.16.0.2 8.8.8.8 8.8.4.4 1.1.1.1 valid=60s;
        resolver_timeout 5s;

        set_by_lua_block $cms_cdn {
            local env = ngx.shared.upstream:get("env")
            -- Map review to demo for CMS endpoints
            if env == "review" then
                env = "demo"
            end
            return "https://cdn.cms." .. env .. ".nypr.digital"
        }
        set_by_lua_block $cms_cdn_host {
            local env = ngx.shared.upstream:get("env")
            -- Map review to demo for CMS endpoints
            if env == "review" then
                env = "demo"
            end
            return "cdn.cms." .. env .. ".nypr.digital"
        }

        set_by_lua_block $wagtail_origin {
            local env = ngx.shared.upstream:get("env")
            -- Map review to demo for CMS endpoints
            if env == "review" then
                env = "demo"
            end
            return "https://cms." .. env .. ".nypr.digital"
        }
        set_by_lua_block $wagtail_host {
            local env = ngx.shared.upstream:get("env")
            -- Map review to demo for CMS endpoints
            if env == "review" then
                env = "demo"
            end
            return "cms." .. env .. ".nypr.digital"
        }
        set_by_lua_block $nuxt_host {
            local env = ngx.shared.upstream:get("env")
            if env == "demo" then
                return "demo.wnyc.org"
            elseif env == "prod" then
                return "prod.wnyc.org"
            else
                return "demo.wnyc.org"
            end
        }
        set_by_lua_block $cms_site {
            local env = ngx.shared.upstream:get("env")
            if env == "demo" then
                return "demo.wnyc.org:443"
            elseif env == "prod" then
                return "wnyc.org:443"
            else
                return "demo.wnyc.org:443"
            end
        }
        set_by_lua_block $wagtail_forwarded_host {
            local env = ngx.shared.upstream:get("env")
            if env == "demo" then
                return "demo.wnyc.org"
            elseif env == "prod" then
                return "prod.wnyc.org"
            else
                return "demo.wnyc.org"
            end
        }
        set_by_lua_block $robots_file {
            return "/app/public/robots-" .. ngx.shared.upstream:get("env") .. ".txt"
        }
        set_by_lua_block $apple_app_site_association {
            return "/app/public/.well-known/apple-app-site-association-" .. ngx.shared.upstream:get("env")
        }
        location / {
            include headers.conf;
            include microcache.conf;
            proxy_pass http://app;
        }
        location = /robots.txt {
            alias $robots_file ;
        }
        location = /.well-known/apple-app-site-association {
            alias $apple_app_site_association;
        }
        # Legacy Images
        location ~ ^/(?:assets_c|attachments|images) {
            proxy_pass $cms_cdn;
            proxy_set_header Host $cms_cdn_host;
            proxy_set_header Origin $cms_cdn;
            proxy_ssl_name $cms_cdn_host;
            proxy_ssl_server_name on;
            proxy_ssl_session_reuse on;
            
            proxy_intercept_errors off;
        }
         
        # site map
        location ~ "^/sitemap(-\w+)?\.xml$" {
            proxy_buffering off;
            proxy_pass $wagtail_origin;
            proxy_set_header Host $wagtail_host;
            proxy_set_header Origin $wagtail_origin;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-CMS-Site $cms_site;
            proxy_http_version 1.1;
            proxy_ssl_name $wagtail_host;
            proxy_ssl_server_name on;
            proxy_ssl_session_reuse on;
        }

        # Proxy 404's to wagtail so that redirects can be added in the CMS
        recursive_error_pages on;
        error_page 404 = @wagtail;
        location @wagtail {
            # We need to ensure there is a trailing slash to the request so that Django doesn't trigger a redirect loop
            rewrite ^/(.*)/$ /$1 permanent;
            proxy_pass $wagtail_origin$request_uri/;

            proxy_set_header Host $wagtail_host;
            proxy_set_header Origin $wagtail_origin;
            proxy_set_header X-Forwarded-Host $wagtail_forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-CMS-Site $cms_site;
            proxy_http_version 1.1;
            proxy_ssl_name $wagtail_host;
            proxy_ssl_server_name on;
            proxy_ssl_session_reuse on;
            proxy_redirect off;
            error_page 404 = @missing;

            add_header Cache-Control 'no-store, no-cache';
        }

        location @missing {
            proxy_pass http://app;
            proxy_intercept_errors off;
            proxy_cache off;

            proxy_set_header Host $nuxt_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-NginX-Proxy true;
            proxy_set_header X-CMS-Site $cms_site;
            proxy_set_header Connection "";

            proxy_http_version 1.1;
        }

        # test endpoint
        location /_test {
            include headers.conf;
            add_header Content-Type application/json;
            return 200 '{"status": "ok"}';
        }

        location /_health {
            access_log off;
            return 200;
        }
    }

    #Redirect www to non-www
    server {
        listen 8080;
        server_name www.wnyc.org;
        return 302 https://wnyc.org$request_uri;
    }
}

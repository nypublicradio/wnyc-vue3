[supervisord]
nodaemon = true


[program:nuxt]
user = www
autorestart = true
command = bash scripts/start-nuxt.sh
directory = /app
redirect_stderr = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
environment=PORT=3000,HOST=0.0.0.0
; Forward SIGTERM to the process group and wait for a clean exit before killing,
; so deploys/scale-in drain in-flight requests instead of hard-killing them (exit 137).
stopsignal = TERM
stopasgroup = true
killasgroup = true
stopwaitsecs = 10

[program:nginx]
user = www
autorestart = true
command = nginx -g "daemon off;"
redirect_stderr = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stopsignal = TERM
stopasgroup = true
killasgroup = true
stopwaitsecs = 10
name: Deploy Review App
on:
  # Run this workflow on every PR event. Existing review apps will be updated when the PR is updated.
  pull_request:
    types: [opened, reopened, synchronize, closed]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  # Set these to your Fly.io organization and preferred region.
  FLY_REGION: iad
  FLY_ORG: personal

jobs:
  review_app:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    # Only run one deployment at a time per PR.
    concurrency:
      group: pr-${{ github.event.number }}

    # Deploying apps with this "review" environment allows the URL for the app to be displayed in the PR UI.
    # Feel free to change the name of this environment.
    environment:
      name: pr-${{ github.event.number }}
      # The script in the `deploy` sets the URL output for each review app.
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Create .npmrc for GitHub Packages
        run: |
          echo "@nypublicradio:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.PAT }}" >> .npmrc

      - name: Update Mock Schedule Data
        run: |
          chmod +x scripts/update-mock-schedule.sh
          ./scripts/update-mock-schedule.sh wnyc-fm939
          ./scripts/update-mock-schedule.sh wqxr
          ./scripts/update-mock-schedule.sh wqxr-holiday-channel-on-wnyc
          ./scripts/update-mock-schedule.sh q2

      # This step is required to set up AWS credentials for the ECR login and deployment steps.
      # The Fly PR Review Apps action uses ECR to store the built Docker images for the review apps,
      # so AWS credentials are needed to authenticate with ECR.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Review App URL
        id: set-url
        run: |
          # Construct the predictable review app URL
          REVIEW_APP_URL="https://pr-${{ github.event.number }}-nypublicradio-wnyc-vue3.fly.dev"
          echo "url=$REVIEW_APP_URL" >> $GITHUB_OUTPUT

      - name: Install Fly CLI
        run: |
          cd /tmp
          curl -L https://fly.io/install.sh > install.sh
          bash install.sh
          ls -la ~/.fly/bin/flyctl || find ~ -name flyctl -type f 2>/dev/null

      - name: Authenticate Fly registry
        run: ~/.fly/bin/flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Ensure Fly review app exists
        run: |
          export PATH="${HOME}/.fly/bin:$PATH"
          APP_NAME="pr-${{ github.event.number }}-nypublicradio-wnyc-vue3"

          if ! flyctl apps show "${APP_NAME}" >/dev/null 2>&1; then
            flyctl apps create "${APP_NAME}" --org "${FLY_ORG}"
          fi

          # Fail fast if app is still unavailable for any reason.
          flyctl apps show "${APP_NAME}" >/dev/null
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push image locally
        run: |
          export PATH="${HOME}/.fly/bin:$PATH"
          APP_NAME="pr-${{ github.event.number }}-nypublicradio-wnyc-vue3"
          IMAGE="registry.fly.io/${APP_NAME}:${{ github.sha }}"
          docker build \
            --build-arg ENV=review \
            --build-arg AVIARY_BASE_API='${{ vars.AVIARY_BASE_API }}' \
            --build-arg SENTRY_DSN='${{ vars.SENTRY_DSN }}' \
            --build-arg SENTRY_ENV='${{ vars.SENTRY_ENV }}' \
            --build-arg LIVESTREAM_URL='${{ vars.LIVESTREAM_URL }}' \
            --build-arg NAVIGATION_API='${{ vars.NAVIGATION_API }}' \
            --build-arg HEADER_NAVIGATION_API='${{ vars.HEADER_NAVIGATION_API }}' \
            --build-arg SYSTEM_MESSAGES_API='${{ vars.SYSTEM_MESSAGES_API }}' \
            --build-arg STORIES_API='${{ vars.STORIES_API }}' \
            --build-arg IMAGE_BASE_URL='${{ vars.IMAGE_BASE_URL }}' \
            --build-arg FB_MEASUREMENT_ID='${{ vars.FB_MEASUREMENT_ID }}' \
            --build-arg FB_API_KEY_WEB='${{ vars.FB_API_KEY_WEB }}' \
            --build-arg FB_API_KEY_IOS='${{ vars.FB_API_KEY_IOS }}' \
            --build-arg FB_API_KEY_ANDROID='${{ vars.FB_API_KEY_ANDROID }}' \
            --build-arg FB_AUTH_DOMAIN='${{ vars.FB_AUTH_DOMAIN }}' \
            --build-arg FB_PROJECT_ID='${{ vars.FB_PROJECT_ID }}' \
            --build-arg FB_STORAGE_BUCKET='${{ vars.FB_STORAGE_BUCKET }}' \
            --build-arg FB_MESSAGING_SENDER_ID='${{ vars.FB_MESSAGING_SENDER_ID }}' \
            --build-arg FB_APP_ID_WEB='${{ vars.FB_APP_ID_WEB }}' \
            --build-arg FB_APP_ID_IOS='${{ vars.FB_APP_ID_IOS }}' \
            --build-arg FB_APP_ID_ANDROID='${{ vars.FB_APP_ID_ANDROID }}' \
            --build-arg GTM_ID='${{ vars.GTM_ID }}' \
            --build-arg SUPABASE_URL='${{ vars.SUPABASE_URL }}' \
            --build-arg SUPABASE_KEY='${{ secrets.SUPABASE_KEY }}' \
            --build-arg SUPABASE_AUTH_SIGN_IN_REDIRECT_TO='https://pr-${{ github.event.number }}-nypublicradio-wnyc-vue3.fly.dev' \
            --build-arg SUPABASE_AUTH_TOKEN_NAME='${{ vars.SUPABASE_AUTH_TOKEN_NAME }}' \
            --build-arg BFF_URL='https://pr-${{ github.event.number }}-nypublicradio-wnyc-vue3.fly.dev' \
            --build-arg OPENWEB_SPOT_ID='${{ vars.OPENWEB_SPOT_ID }}' \
            --build-arg NPR_CDS_API='${{ vars.NPR_CDS_API }}' \
            --build-arg WNYC_NOW_FEED_URL='${{ vars.WNYC_NOW_FEED_URL }}' \
            --build-arg WNYC_SHOW_SHARE_BASE_URL='${{ vars.WNYC_SHOW_SHARE_BASE_URL }}' \
            --build-arg ARTICLE_STREAMFIELD_DONATION_URL='${{ vars.ARTICLE_STREAMFIELD_DONATION_URL }}' \
            --build-arg SETTINGS_MENU_DONATION_URL='${{ vars.SETTINGS_MENU_DONATION_URL }}' \
            --build-arg USER_AGENT='${{ vars.USER_AGENT }}' \
            --build-arg APP_VERSION='${{ vars.APP_VERSION }}' \
            --build-arg SPRINGBOARD_URL='${{ vars.SPRINGBOARD_URL }}' \
            --build-arg NEWSLETTER_API='${{ vars.NEWSLETTER_API }}' \
            --build-arg RAPID_ASSET_URL='${{ vars.RAPID_ASSET_URL }}' \
            --build-arg SIMPLECAST_URL='${{ vars.SIMPLECAST_URL }}' \
            --build-arg FEATURED_SHOWS_PAGE_ID='${{ vars.FEATURED_SHOWS_PAGE_ID }}' \
            --build-arg NUXT_SSR=true \
            --build-arg CMS_SITE='${{ vars.CMS_SITE }}' \
            -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "image=${IMAGE}" >> $GITHUB_ENV
          echo "app_name=${APP_NAME}" >> $GITHUB_ENV

      - name: Deploy PR Review App
        id: deploy
        uses: superfly/fly-pr-review-apps@1.5.0
        with:
          image: ${{ env.image }}
          name: ${{ env.app_name }}
          secrets: |
            ENV=review
            AVIARY_BASE_API=${{ vars.AVIARY_BASE_API }}
            CMS_SITE=${{ vars.CMS_SITE }}
            NPR_CDS_API_KEY=${{ secrets.NPR_CDS_API_KEY }}
            PUBLISHER_BASE_API=${{ vars.PUBLISHER_BASE_API }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SF_CLIENT_ID=${{ secrets.SF_CLIENT_ID }}
            SF_USERNAME=${{ secrets.SF_USERNAME }}
            SF_PRIVATE_KEY=${{ secrets.SF_PRIVATE_KEY }}
            SF_LOGIN_URL=${{ secrets.SF_LOGIN_URL }}
            PAT=${{ secrets.PAT }}
            SUPABASE_URL=${{ vars.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN }}
            SPRINGBOARD_KEY=${{ secrets.SPRINGBOARD_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            SIMPLECAST_API_KEY=${{ secrets.SIMPLECAST_API_KEY }}
            RAPID_ASSET_URL=${{ vars.RAPID_ASSET_URL }}
      - name: Delete GitHub Environment
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.deleteAnEnvironment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: `pr-${{ github.event.number }}`
              });
              console.log('GitHub environment deleted successfully');
            } catch (error) {
              console.log('Environment not found or already deleted:', error.message);
            }

      - name: Send Slack notification
        if: ${{ github.event.action != 'closed' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: "#audience-pr-review"
          SLACK_COLOR: "good"
          SLACK_ICON_EMOJI: ":rocket:"
          SLACK_TITLE: "Review App Deployed"
          SLACK_MESSAGE: |
            **Pull Request:** <${{ github.event.pull_request.html_url }}|#${{ github.event.number }}: ${{ github.event.pull_request.title }}>
            **Review App URL:** <${{ steps.set-url.outputs.url }}|${{ steps.set-url.outputs.url }}>
            **Branch:** ${{ github.head_ref }}
            **Author:** ${{ github.event.pull_request.user.login }}

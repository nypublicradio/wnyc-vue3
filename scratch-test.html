<!DOCTYPE html>
<html>
<head>
<style>
  .imgCol {
    height: 12rem; /* The tailwind class */
  }

  .image {
    flex: 0 0 auto !important;
    width: auto !important;
    /* max-width: none !important; */
    border: 2px solid red;
  }

  .v-image-wrapper {
    width: auto !important;
    height: 100% !important;
    border: 2px solid green;
  }

  .v-image-link {
    display: block;
    height: 100% !important;
  }

  .v-image-holder {
    aspect-ratio: auto !important;
    width: auto !important;
    height: 100% !important;
    border: 2px solid blue;
  }

  img.image {
    width: auto !important;
    height: 100% !important;
    max-width: none !important;
    max-height: none !important;
  }
</style>
</head>
<body>
  <div class="image imgCol">
    <div class="v-image-wrapper">
      <a class="v-image-link">
        <div class="v-image-holder">
          <img class="image" src="https://via.placeholder.com/600x400" width="300" height="200">
        </div>
      </a>
    </div>
  </div>
</body>
</html>
